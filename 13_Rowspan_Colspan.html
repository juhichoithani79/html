<html>
    <head>
        <title>table rowspan and colspan</title>
    </head>
    <body>
        <h1>Student result</h1>
        <table border="1" cellpadding="5" cellspacing="5">
            <tr>
                <th colspan="3">Student details</th>
            </tr>
            <tr>
                <th>name</th>
                <th>subject</th>
                <th>marks</th>
            </tr>
            <tr>
                <td rowspan="2">juhi</td>
                <td>html</td>
                <td>85</td>
            </tr>
            <tr>
                <td>css</td>
                <td>90</td>
            </tr>
        </table>
    </body>
</html>
